<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>TWINE</title>
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <main id="twine-shell">
    <canvas id="unity-canvas" tabindex="-1" aria-label="TWINE game canvas"></canvas>
    <section id="loading" aria-live="polite">
      <div class="wordmark">TWINE</div>
      <div class="track"><div id="progress"></div></div>
      <p id="status">게임을 불러오는 중…</p>
    </section>
    <section id="error" hidden>
      <h1>TWINE을 시작하지 못했습니다</h1>
      <p id="error-message"></p>
      <button type="button" onclick="window.location.reload()">다시 시도</button>
    </section>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#progress');
    const status = document.querySelector('#status');
    const errorPanel = document.querySelector('#error');
    const errorMessage = document.querySelector('#error-message');

    function showError(message) {
      loading.hidden = true;
      errorPanel.hidden = false;
      errorMessage.textContent = message || '브라우저 콘솔을 확인해 주세요.';
    }

    window.addEventListener('error', event => showError(event.message));
    window.addEventListener('unhandledrejection', event =>
      showError(event.reason && event.reason.message ? event.reason.message : String(event.reason)));

    const buildUrl = 'Build';
    const config = {
      arguments: [],
      autoSyncPersistentDataPath: true,
      dataUrl: buildUrl + '/WebGL.data',
      frameworkUrl: buildUrl + '/WebGL.framework.js',
      codeUrl: buildUrl + '/WebGL.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'TWINE',
      productVersion: '1.0',
      showBanner: (message, type) => {
        if (type === 'error') showError(message);
        else status.textContent = message;
      }
    };

    const loader = document.createElement('script');
    loader.src = buildUrl + '/WebGL.loader.js';
    loader.onload = () => createUnityInstance(canvas, config, value => {
      progress.style.width = Math.round(value * 100) + '%';
      status.textContent = `게임을 불러오는 중… ${Math.round(value * 100)}%`;
    }).then(instance => {
      window.twineUnityInstance = instance;
      loading.hidden = true;
      canvas.focus();
    }).catch(error => showError(error.message || String(error)));
    loader.onerror = () => showError('Unity 로더 파일을 내려받지 못했습니다. 서버 압축 헤더를 확인해 주세요.');
    document.body.appendChild(loader);
  </script>
</body>
</html>
